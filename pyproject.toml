[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-class-decks"
version = "0.1.0"
description = "Agent skill and QA pipeline for visually excellent, editable PowerPoint decks."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "World Class Decks contributors"}]
dependencies = [
  "python-pptx>=1.0.2",
  "Pillow>=10.3",
  "PyYAML>=6.0",
  "jsonschema>=4.22",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
wcd = "world_class_decks.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
